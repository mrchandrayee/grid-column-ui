<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b111d">
  <title>Grid Column UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Grid Column UI</h1>

    <div class="presets" role="group" aria-label="Grid column presets">
      <button class="preset active" type="button" data-columns="1fr 1fr 1fr">1fr 1fr 1fr</button>
      <button class="preset" type="button" data-columns="3fr 1fr 1fr">3fr 1fr 1fr</button>
      <button class="preset" type="button" data-columns="1fr 3fr 1fr">1fr 3fr 1fr</button>
      <button class="preset" type="button" data-columns="1fr 1fr 3fr">1fr 1fr 3fr</button>
      <button class="preset" type="button" data-columns="2fr 4fr 2fr">2fr 4fr 2fr</button>
      <button class="preset" type="button" data-columns="10% 70% 10%">10% 70% 10%</button>
    </div>

    <section class="grid-preview" aria-label="Live CSS grid preview">
      <div class="grid-column">Col 1</div>
      <div class="grid-column">Col 2</div>
      <div class="grid-column">Col 3</div>
    </section>

    <output class="code-output" id="codeOutput" aria-live="polite">
      grid-template-columns: 1fr 1fr 1fr;
    </output>
  </main>
  <script src="script.js"></script>
</body>
</html>
